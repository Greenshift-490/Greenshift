[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenshift"
version = "0.1.0"
description = "Carbon-aware scheduler for flexible cloud workloads"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "tzdata; sys_platform == 'win32'",  # time zone database; Windows doesn't ship one
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["greenshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
